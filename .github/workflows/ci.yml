name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: make build

      - name: Validate docker compose
        env:
          JWT_SECRET: ci-secret-value-with-more-than-32-characters
          SUPER_ADMIN_PASSWORD: ci-admin-password
        run: docker compose config
