name: Build and Deploy RentCar Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/abduazim0811/rentcar-backend:latest
  FRONTEND_IMAGE: ghcr.io/abduazim0811/rentcar-frontend:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t $BACKEND_IMAGE \
            -t ghcr.io/abduazim0811/rentcar-backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push $BACKEND_IMAGE
          docker push ghcr.io/abduazim0811/rentcar-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.ghcr.yml
          target: ~/rentcar

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,HTTP_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,ACCESS_TOKEN_TTL,REFRESH_TOKEN_TTL,SUPER_ADMIN_NAME,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD,IMAGE_PUBLIC_URL,CORS_ALLOWED_ORIGINS,HTTP_READ_TIMEOUT,HTTP_WRITE_TIMEOUT,HTTP_IDLE_TIMEOUT,HTTP_SHUTDOWN_TIMEOUT,HTTP_MAX_BODY_BYTES,RATE_LIMIT_MAX_REQUESTS,RATE_LIMIT_WINDOW,DB_MAX_CONNS,DB_MIN_CONNS,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,MINIO_BUCKET,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,SMTP_FROM_NAME,SMTP_USE_TLS,EMAIL_VERIFICATION_TTL,REGISTRY_TOKEN
          script: |
            echo "Logging in to GHCR..."
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u abduazim0811 --password-stdin

            echo "Writing .env file..."
            mkdir -p ~/rentcar
            mv ~/rentcar/docker-compose.ghcr.yml ~/rentcar/docker-compose.yml
            cat > ~/rentcar/.env << EOF
            COMPOSE_PROJECT_NAME=rentcar
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            HTTP_PORT=$HTTP_PORT
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            ACCESS_TOKEN_TTL=$ACCESS_TOKEN_TTL
            REFRESH_TOKEN_TTL=$REFRESH_TOKEN_TTL
            SUPER_ADMIN_NAME=$SUPER_ADMIN_NAME
            SUPER_ADMIN_EMAIL=$SUPER_ADMIN_EMAIL
            SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD
            IMAGE_PUBLIC_URL=$IMAGE_PUBLIC_URL
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            HTTP_READ_TIMEOUT=$HTTP_READ_TIMEOUT
            HTTP_WRITE_TIMEOUT=$HTTP_WRITE_TIMEOUT
            HTTP_IDLE_TIMEOUT=$HTTP_IDLE_TIMEOUT
            HTTP_SHUTDOWN_TIMEOUT=$HTTP_SHUTDOWN_TIMEOUT
            HTTP_MAX_BODY_BYTES=$HTTP_MAX_BODY_BYTES
            RATE_LIMIT_MAX_REQUESTS=$RATE_LIMIT_MAX_REQUESTS
            RATE_LIMIT_WINDOW=$RATE_LIMIT_WINDOW
            DB_MAX_CONNS=$DB_MAX_CONNS
            DB_MIN_CONNS=$DB_MIN_CONNS
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            MINIO_BUCKET=$MINIO_BUCKET
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USERNAME=$SMTP_USERNAME
            SMTP_PASSWORD=$SMTP_PASSWORD
            SMTP_FROM=$SMTP_FROM
            SMTP_FROM_NAME=$SMTP_FROM_NAME
            SMTP_USE_TLS=$SMTP_USE_TLS
            EMAIL_VERIFICATION_TTL=$EMAIL_VERIFICATION_TTL
            EOF
            chmod 600 ~/rentcar/.env

            echo "Pulling latest images..."
            docker compose --env-file ~/rentcar/.env -f ~/rentcar/docker-compose.yml pull

            echo "Starting RentCar stack..."
            docker compose --env-file ~/rentcar/.env -f ~/rentcar/docker-compose.yml up -d

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Deployment successful!"
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_TTL: ${{ secrets.ACCESS_TOKEN_TTL }}
          REFRESH_TOKEN_TTL: ${{ secrets.REFRESH_TOKEN_TTL }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          IMAGE_PUBLIC_URL: ${{ secrets.IMAGE_PUBLIC_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          HTTP_READ_TIMEOUT: ${{ secrets.HTTP_READ_TIMEOUT }}
          HTTP_WRITE_TIMEOUT: ${{ secrets.HTTP_WRITE_TIMEOUT }}
          HTTP_IDLE_TIMEOUT: ${{ secrets.HTTP_IDLE_TIMEOUT }}
          HTTP_SHUTDOWN_TIMEOUT: ${{ secrets.HTTP_SHUTDOWN_TIMEOUT }}
          HTTP_MAX_BODY_BYTES: ${{ secrets.HTTP_MAX_BODY_BYTES }}
          RATE_LIMIT_MAX_REQUESTS: ${{ secrets.RATE_LIMIT_MAX_REQUESTS }}
          RATE_LIMIT_WINDOW: ${{ secrets.RATE_LIMIT_WINDOW }}
          DB_MAX_CONNS: ${{ secrets.DB_MAX_CONNS }}
          DB_MIN_CONNS: ${{ secrets.DB_MIN_CONNS }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_VERIFICATION_TTL: ${{ secrets.EMAIL_VERIFICATION_TTL }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
